name: Build Mobile Packages (iOS Simulator & Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS Simulator (.app.zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test

      - name: Build iOS Simulator bundle
        run: flutter build ios --simulator --debug

      - name: Package Runner.app as zip (for Appetize.io / Simulator)
        run: |
          cd build/ios/iphonesimulator
          zip -r -y ../../../Inscriber-iOS-Simulator.app.zip Runner.app

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inscriber-iOS-Simulator
          path: Inscriber-iOS-Simulator.app.zip
          retention-days: 14

  build-android-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build Android release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inscriber-Android-arm64-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
